name: Client release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt ruff
      - run: ruff check salt scripts tests
      - run: ruff format --check salt scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate-salt-minion.py
