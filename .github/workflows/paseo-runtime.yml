name: Build Paseo runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify on Ubuntu 26.04 amd64
        run: |
          mkdir -p output
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/source:ro" -v "$PWD/output:/output" ubuntu:26.04 \
            bash -euc 'export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y python3 ca-certificates git build-essential pkg-config
              python3 /source/scripts/build-paseo-runtime.py --ubuntu 26.04 --output /output'
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-ubuntu26.04-amd64
          path: output/
          retention-days: 90
          if-no-files-found: error
